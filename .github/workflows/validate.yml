name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the skill set
        run: python scripts/validate.py

      - name: Check the pl-clear-technical-communication harness
        working-directory: evals/pl-clear-technical-communication
        run: |
          python -m pip install --quiet pyyaml
          python validate.py
          node --test test-runner.cjs
